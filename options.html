<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrivacyRedirect+ Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page">
  <div class="shell">
    <header class="brand">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2.5"/><circle cx="16" cy="4" r="2.5"/><circle cx="16" cy="16" r="2.5"/><path d="M6.5 10H9c2 0 2-6 4.5-6M9 10c2 0 2 6 4.5 6"/></svg>
      <span class="brand-name">PrivacyRedirect+</span>
    </header>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="sites">Sites</button>
      <button type="button" data-view="instances">Instances</button>
      <button type="button" data-view="self-host">Self-host</button>
      <button type="button" data-view="quick">Quick access</button>
    </nav>
    <main id="view" class="sheet" tabindex="-1"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
